<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelfrip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='3' y='4' width='5' height='18' rx='1.5' fill='%23F2B33D'/%3E%3Crect x='10' y='7' width='5' height='15' rx='1.5' fill='%236C9BFF'/%3E%3Crect x='17' y='5' width='5' height='17' rx='1.5' fill='%234CC38A'/%3E%3Crect x='2' y='23' width='24' height='2.5' rx='1' fill='%23C9D1DC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014; --bar:#12151B; --card:#161A21; --card2:#1E232C; --ink:#ECEFF4; --muted:#9AA3B2; --line:#262C36; --line2:#343B47;
  --accent:#6C9BFF; --accent-ink:#0B1020; --xp:#F2B33D; --xp-ink:#1A1204; --warn-bg:#3A2E12; --warn:#F7C86A;
  --skip:#6b7580; --ok:#4CC38A; --ok-bg:#1D3A2C; --ok-ink:#7EE0AE; --err:#FF8A7A; --chip:#1E232C; --input:#0E1014; --flame:#FF8A4C;
  --head:"Space Grotesk","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F4F5F8; --bar:#FFFFFF; --card:#FFFFFF; --card2:#EEF1F5; --ink:#161A21; --muted:#5A6472; --line:#DDE2E8; --line2:#C9D0D9;
    --accent:#2F64D8; --accent-ink:#FFFFFF; --xp:#9A6400; --xp-ink:#FFFFFF; --warn-bg:#FFF4D6; --warn:#7A5200;
    --skip:#9aa4ae; --ok:#1F8A55; --ok-bg:#E2F5EA; --ok-ink:#17643E; --err:#B42318; --chip:#EEF1F5; --input:#FFFFFF; --flame:#D2551B;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--head);letter-spacing:-.01em}
header{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);
  padding:10px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:19px;margin-right:6px}
header .sub{color:var(--muted)}
main{max-width:1240px;margin:0 auto;padding:22px 24px 90px}
button{font:inherit;border:1px solid var(--line2);background:var(--card2);color:var(--ink);
  border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.gold{background:var(--xp);color:var(--xp-ink);border-color:var(--xp);font-weight:700}
button.good{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 20px;overflow:hidden}
.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.hero{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.hero .info{flex:1 1 380px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title{font-family:var(--head);font-size:24px;font-weight:700;line-height:1.15}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);text-decoration:none}
.chip.good{background:var(--ok-bg);color:var(--ok-ink);font-weight:600}
.chip.warnc{background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip.xp{background:transparent;color:var(--xp);font-weight:700;font-family:var(--head);font-size:14px;padding:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.err{color:var(--err)} .ok{color:var(--ok)}
label.f{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
label.f input{min-width:0}
.libdir{flex:1 1 420px} .libdir input{width:100%}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card2)}
tr.skip td{color:var(--skip)} tr.skip input,tr.skip select.typ{opacity:.45} tr.skip .nm{text-decoration:line-through}
td.dur{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
td.src{font-size:12px;color:var(--muted);max-width:160px;overflow-wrap:anywhere}
td.name input{width:100%}
.dest{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}
.note{font-size:12px;color:var(--warn)}
.foot{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card2);border-top:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1 1 200px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.bar.ok>i{background:var(--ok)} .bar.xp>i{background:var(--xp)}
.search{display:none;gap:6px;flex-direction:column;padding:10px;background:var(--card2);border-radius:12px}
.search.open{display:flex}
.result{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.result small{color:var(--muted)}
.result .poster{width:46px;height:68px;border-radius:6px;font-size:8px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.tablewrap{overflow-x:auto}
nav.tabs{display:none;gap:2px;flex-wrap:wrap} nav.tabs.on{display:flex}
nav.tabs button{border-radius:999px;border-color:transparent;background:transparent;padding:8px 14px;font-weight:500}
nav.tabs button.cur{background:var(--ink);color:var(--bg);font-weight:600}
.count{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--xp);color:var(--xp-ink);font-size:12px;font-weight:700;margin-left:6px}
.count.zero{background:var(--chip);color:var(--muted)}
.seg{display:inline-flex;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:nowrap;white-space:nowrap}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 12px;font-weight:600;min-width:58px}
.seg button.on.keep{background:var(--ok);color:#0B1A12} .seg button.on.skip{background:var(--line2);color:var(--ink)}
/* poster */
.poster{flex:none;width:84px;height:124px;border-radius:10px;background:var(--card2) center/cover no-repeat;border:1px solid var(--line2);
  display:flex;align-items:flex-end;padding:7px;font-family:var(--head);font-weight:700;font-size:11px;color:#E8EDF5;overflow:hidden;position:relative}
.poster.big{width:168px;height:248px;border-radius:14px;font-size:16px;padding:12px}
.poster.has span{display:none}
.poster .ring{position:absolute;right:-1px;bottom:-1px}
/* HUD */
.hud{display:flex;align-items:center;gap:12px}
.streak{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.streak.cold{color:var(--muted)}
.lvl{display:flex;align-items:center;gap:10px;min-width:230px;cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
.lvl .n{width:38px;height:38px;border-radius:10px;background:var(--xp);color:var(--xp-ink);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:16px}
.lvl .t{flex:1;display:grid;gap:4px} .lvl .t div:first-child{display:flex;justify-content:space-between;font-size:12px;gap:10px}
.lvl .t .bar{height:7px;flex:none}
/* home */
.panels{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.goal{display:grid;gap:6px} .goal .row{justify-content:space-between}
.goal.done .bar>i{background:var(--ok)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar h2,.sect h2{margin:0;font-size:20px}
.switch{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tog{width:40px;height:24px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s}
.switch .tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:left .2s}
.switch input:checked+.tog{background:var(--ok)} .switch input:checked+.tog::after{left:19px}
.switch input:focus-visible+.tog{outline:2px solid var(--accent);outline-offset:2px}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:26px}
.drive{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;align-content:start}
.drive.busy{border-color:#3A4A6B} .drive.ready{border-color:var(--xp)} .drive.idle{border-style:dashed}
.drive .top{display:flex;gap:16px;align-items:center}
.drive .dev{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}
.drive .lab{font-family:var(--head);font-weight:600;font-size:18px;overflow-wrap:anywhere;line-height:1.2}
.drive .st{color:var(--muted);font-size:13px}
.drive details.titles{min-width:0}
.drive details.titles summary{cursor:pointer;color:var(--muted);font-size:13px}
.drive .tscroll{max-height:260px;overflow:auto;margin-top:8px}
.drive .tscroll table{width:100%;border-collapse:collapse;font-size:12px}
.drive .tscroll th,.drive .tscroll td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.drive .tscroll tr.muted td{color:var(--muted)}
.drive .st.live{color:var(--accent);font-weight:600} .drive .st.ready{color:var(--xp);font-weight:600}
.drive .bar{flex:none}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:26px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;color:inherit;font:inherit}
.qcard .poster{width:60px;height:88px}
.qcard:hover{border-color:var(--muted)}
details.log summary{cursor:pointer;color:var(--muted);margin-bottom:8px}
pre.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12px;
  max-height:320px;overflow:auto;white-space:pre-wrap;margin:0;color:var(--muted)}
.disk{display:flex;gap:8px;flex-wrap:wrap}
/* shelf */
.shelf{display:flex;align-items:flex-end;gap:4px;padding:0 14px;min-height:188px;overflow-x:auto;border-bottom:10px solid #5A4632;border-radius:0 0 4px 4px}
.spine{flex:none;width:30px;border-radius:4px 4px 2px 2px;display:flex;align-items:center;justify-content:center;padding:8px 0;
  border-top:4px solid rgba(255,255,255,.18);color:#F4F6FA;cursor:default}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--head);font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;max-height:100%}
.spine.new{animation:drop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.ranks{display:grid;gap:10px}
.rank{display:flex;align-items:center;gap:12px}
.rank .n{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;background:var(--card2);color:var(--muted)}
.rank.got .n{background:var(--warn-bg);color:var(--xp)} .rank.cur .n{background:var(--xp);color:var(--xp-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:5px;justify-items:start}
.badge.locked{opacity:.55} .badge .bar{width:100%;height:5px;flex:none}
/* moments */
.card.filing{padding:20px 22px}
.filing-in{display:flex;gap:20px;align-items:center}
.filing-info{flex:1;display:grid;gap:8px;justify-items:start;min-width:0}
.filing-info h2{margin:0;font-family:var(--head);font-size:22px}
.filing-info h2 span{color:var(--muted);font-weight:500;font-size:16px}
.filing-bar{display:flex;gap:12px;align-items:center;width:100%}
.filing-bar .bar{height:10px}
.filing-now{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.celebrate{background:var(--ok-bg);border:1px solid var(--ok);border-radius:18px;padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:0 0 20px}
.celebrate .big{font-family:var(--head);font-size:24px;font-weight:700}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:20;max-width:360px}
.toast{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.4);
  display:flex;gap:12px;align-items:center;animation:pop .35s ease-out}
.toast b{font-family:var(--head)}
.toast.trouble{max-width:360px}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.spine.new,.case.new,.case.new::after,.toast{animation:none}.case{transition:none}.bar>i{transition:none}}
.set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;max-width:780px}
.set label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.set label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.set input[type=text],.set input[type=password],.set input[type=number],.set select{width:100%}
.wz{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 30px 18px;max-width:660px;margin:6px auto 16px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.wz-top{display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.wz-dots{display:flex;gap:6px}
.wz-dot{width:12px;height:12px;padding:0;border-radius:50%;background:var(--card2);border:1px solid var(--line2)}
.wz-dot.good{background:var(--ok);border-color:var(--ok)}
.wz-dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.wz-bar{height:6px;margin-bottom:6px}.wz-bar>i{background:linear-gradient(90deg,var(--accent),var(--xp))}
.wz-step{text-align:center;padding:14px 4px 4px;animation:pop .3s ease-out}
.wz-step h2{font-size:26px;margin:10px 0 6px}
.wz-step p{margin:6px auto;max-width:520px;color:var(--ink)}
.wz-muted,.wz-step p.wz-muted{color:var(--muted);font-size:13px}
.wz-art{position:relative;width:84px;height:84px;margin:4px auto 2px;border-radius:26px;display:grid;place-items:center;color:var(--accent);
  background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--accent) 28%,transparent),color-mix(in srgb,var(--accent) 8%,transparent));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.wz-art.ok{color:var(--ok);background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--ok) 28%,transparent),color-mix(in srgb,var(--ok) 8%,transparent));border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.wz-art.gold{color:var(--xp);background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--xp) 32%,transparent),color-mix(in srgb,var(--xp) 8%,transparent));border-color:color-mix(in srgb,var(--xp) 50%,transparent)}
.wz-art i{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center;animation:pop .35s ease-out}
.wz-field{display:flex;gap:8px;max-width:520px;margin:14px auto 4px}
.wz-field input{flex:1;padding:10px 12px;font-size:15px;cursor:text}
.wz-field input[data-pickme]:placeholder-shown,input.pickme:placeholder-shown{cursor:pointer}
.wz-field button{padding:10px 14px}
.wz-status{max-width:520px;margin:8px auto 0;font-size:13px;color:var(--err);word-break:break-word}
.wz-status.ok{color:var(--ok)}.wz-status.warnline{color:var(--warn)}.wz-status.soft{color:var(--muted)}
.wz-chk{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px auto 0;font-size:13px;color:var(--muted)}
.wz-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:540px;margin:16px auto 4px}
.wz-tile{display:grid;justify-items:center;gap:6px;padding:16px 12px;border-radius:16px;background:var(--card2);border:2px solid var(--line2);transition:transform .12s,border-color .12s}
.wz-tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.wz-tile.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
.wz-tile b{font-family:var(--head);font-size:16px}.wz-tile span{font-size:12px;color:var(--muted)}
.wz-tile .wz-badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:700;font-size:20px}
.wz-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.wz-btn{display:inline-block;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);text-decoration:none}
.wz-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.wz-how{text-align:left;max-width:470px;margin:10px auto;padding-left:22px;display:grid;gap:4px}
.wz-sum{list-style:none;padding:0;margin:14px auto;max-width:360px;display:grid;gap:8px;text-align:left}
.wz-sum li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card2)}
.wz-sum li>span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--err);color:#fff}
.wz-sum li.ok>span{background:var(--ok)}.wz-sum li b{flex:1;font-weight:600}
.wz-nav{display:flex;gap:8px;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
button.big{padding:10px 20px;font-size:15px}
button.linkish{background:none;border:none;color:var(--accent);padding:4px 6px;text-decoration:underline;text-underline-offset:2px}
#wizmsg:empty{display:none}#wizmsg{margin-top:8px;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion: reduce){.wz-step,.wz-art i{animation:none}.wz-tile{transition:none}}
@media (max-width:560px){.wz{padding:18px 16px}.wz-field{flex-direction:column}.wz-top{flex-direction:column;align-items:flex-start}}
.hide{display:none!important}
.warnline{color:var(--warn)}
.aud{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.aud .trk{border:1px solid var(--line2);border-radius:12px;padding:1px 8px;cursor:pointer;background:var(--card);color:var(--muted);font-size:12px}
.aud .trk.com{border-color:var(--accent);color:var(--ink)}
.aud input{font-size:12px;padding:2px 5px;min-width:220px}
tr.splitrow td{background:var(--card2);border-bottom:1px solid var(--line)}
.split{display:grid;gap:6px;padding:4px 0}
.split table td{border-bottom:none;padding:3px 6px}
.split .sl{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:12px}
.split .snm{width:100%}
.play{border-radius:50%;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center}
@media (max-width:700px){ td.src{display:none} th.src{display:none} .lvl{min-width:0} .lvl .t{display:none} .poster.big{width:110px;height:162px} }
#upd{font-size:13px;font-weight:600}

<body>
<header>
  <span class="brand"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="4" width="5" height="18" rx="1.5" fill="#F2B33D"/><rect x="10" y="7" width="5" height="15" rx="1.5" fill="#6C9BFF"/><rect x="17" y="5" width="5" height="17" rx="1.5" fill="#4CC38A"/><rect x="2" y="23" width="24" height="2.5" rx="1" fill="#9AA3B2"/></svg>Shelfrip</span>
  <nav class="tabs" id="tabs" aria-label="Main">
    <button data-tab="drives">Home</button>
    <button data-tab="review">Review<span class="count zero" id="nwait">0</span></button>
    <button data-tab="library">My shelf</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <span class="sub" id="sub"></span>
  <span style="flex:1"></span>
  <button id="scan" class="tab-review">Check for new rips</button>
  <a id="upd" class="hide" target="_blank" rel="noopener"></a>
  <div class="hud hide" id="hud"></div>
  <a id="donate" class="hide" target="_blank" rel="noopener" title="Shelfrip is free. Donations help pay for things like code signing.">&#9829;<span class="dt"> Donate</span></a>
  <button id="fbbtn" title="Send an idea or report a problem">Feedback</button>
  <button id="quit" class="hide">Quit</button>
</header>
<div id="toasts" aria-live="polite"></div>
<main id="drivesTab" class="hide"></main>
<main id="list"><p class="empty">Loading…</p></main>
<main id="libraryTab" class="hide"></main>
<main id="settingsTab" class="hide"></main>

<script>
const CATS = ["Featurettes","Behind the Scenes","Deleted Scenes","Interviews","Scenes","Shorts","Trailers","Other"];
let discs = [], LIB = "", LIB_RIPPED = "", SERVER = "plex", SERVER_NAME = "Plex", EXTRAS_SUFFIX = false;
// name parts the same way naming.py does for the chosen media server
const idTag = id => !id ? "" : SERVER === "plex" ? ` {tmdb-${id}}` : SERVER === "jellyfin" ? ` [tmdbid-${id}]` : SERVER === "emby" ? ` [tmdbid=${id}]` : "";
const editionName = (base, ed) => SERVER === "plex" ? `${base} {edition-${ed}}` : `${base} - ${ed}`;
const $ = (s, el=document) => el.querySelector(s);
// HTML-escape text before putting it in markup (single quotes too, for attributes written with ')
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe = s => String(s||"").replace(/\s*:\s*/g," - ").replace(/[<>"/\\|?*]/g,"").replace(/\s+/g," ").trim().replace(/[ .]+$/,"");

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

// ------------------------------------------------------------------ the game layer: box art, XP, toasts
let PROG = null;
const POSTERS = {};
const hueOf = t => { let h = 0; for (const c of String(t||"")) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const tint = t => `hsl(${hueOf(t)} 32% 28%)`;
// Box art: TMDB's poster (a season's own poster for TV), or the CD's cover from the Cover Art Archive.
function poster(kind, id, season, title, cls = "", mbid = ""){
  const data = kind === "music" ? (mbid ? `data-url="https://coverartarchive.org/release/${esc(mbid)}/front-250"` : "")
    : id ? `data-pk="${esc(kind)}" data-pid="${esc(id)}" data-ps="${esc(season ?? "")}"` : "";
  const k = kind === "music" ? mbid : `${kind}:${id}:${season ?? ""}`, url = SHOWN[k];
  return `<div class="poster ${cls} ${url ? "has" : ""}" ${data} role="img" aria-label="Box art: ${esc(title)}" style="background-color:${tint(title)}${url ? `;background-image:url('${esc(url)}')` : ""}"><span>${esc(title)}</span></div>`;
}
let SOUND = true, SHARING = true, AC = null, DONATE = "";
function chime(kind){  // made on the spot with Web Audio: no sound files to ship
  if (!SOUND) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const notes = {file:[659.25, 987.77], level:[523.25, 659.25, 783.99, 1046.5], badge:[1318.5, 1568, 2093]}[kind] || [880];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * 0.11;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.55);
    });
  } catch(e){}
}
const SHOWN = {};  // box art already loaded: drawn straight away when the page redraws
function hydrate(root){
  (root || document).querySelectorAll(".poster").forEach(async d => {
    if (d.classList.contains("has") && !(d.closest(".hero") && !d.closest(".hero").querySelector(".blurb").textContent)) return;
    let r = {};
    if (d.dataset.url) r = {url: d.dataset.url};
    else if (d.dataset.pid){
      const k = `${d.dataset.pk}:${d.dataset.pid}:${d.dataset.ps}`;
      POSTERS[k] = POSTERS[k] || api(`/api/poster?kind=${d.dataset.pk}&id=${d.dataset.pid}&season=${d.dataset.ps}`).catch(() => ({}));
      r = await POSTERS[k];
    }
    if (r.url){
      const img = new Image();
      img.onload = () => { d.style.backgroundImage = `url("${r.url}")`; d.classList.add("has");
        SHOWN[d.dataset.url ? d.dataset.url.split("/")[4] : `${d.dataset.pk}:${d.dataset.pid}:${d.dataset.ps}`] = r.url; };
      img.src = r.url;
    }
    const blurb = d.closest(".hero") && d.closest(".hero").querySelector(".blurb");
    if (blurb && r.overview && !blurb.textContent) blurb.textContent = r.overview;
  });
}
// XP for filing this disc (the same rules as progress.py)
function xpOf(p){
  const kept = (p.items||[]).filter(it => it.action === "move");
  let xp = 50;
  if (p.kind === "music") return xp + 2 * kept.length;
  for (const it of kept){
    if (it.role === "extra") xp += 5 + (it.name && !/^(Extra \d+ \(|Unused clip)/i.test(it.name) ? 10 : 0);
    else if (["main","edition","episode"].includes(it.role)) xp += 10;
  }
  if (/4k/i.test(p.format || "")) xp += 30;
  return xp;
}
function toast(title, text, color){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l14 8v18l-14 8-14-8V11z" fill="${color || "var(--xp)"}"/></svg><div><b>${esc(title)}</b><div style="color:var(--muted);font-size:13px">${esc(text)}</div></div>`;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 7000);
}
// When something fails (a rip, a filing), ask once whether to send an error report.
// Nothing is sent until you click Send in the feedback window, where you can read and edit it.
const TROUBLE_SEEN = new Set();
function troublePrompt(list){
  (list || []).forEach(f => {
    if (TROUBLE_SEEN.has(f.id)) return;
    TROUBLE_SEEN.add(f.id);
    const t = document.createElement("div");
    t.className = "toast trouble";
    t.setAttribute("role", "alert");
    t.innerHTML = `<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l17 32H3z" fill="var(--bad, #d9534f)"/></svg>
      <div style="display:grid;gap:6px"><b>${esc(f.what)}${f.label ? `: ${esc(f.label)}` : ""}</b>
      <div style="color:var(--muted);font-size:13px">${esc(f.error)}</div>
      <div style="font-size:13px">Send an error report so it can be fixed? You'll see exactly what's sent first.</div>
      <div class="row" style="gap:8px"><button class="primary" data-tsend>Send a report…</button><button data-tno>Not now</button></div></div>`;
    $("#toasts").appendChild(t);
    $("[data-tno]", t).onclick = () => { api("/api/trouble", {id: f.id, action: "dismiss"}); t.remove(); };
    $("[data-tsend]", t).onclick = () => {
      t.remove();
      FBKIND = "problem";
      feedbackDialog({t: `Error report: ${f.what}${f.label ? ` (${f.label})` : ""}`.slice(0, 200),
                      m: `What I was doing: \n\n---\n${f.preview}`.slice(0, 5000), trouble: f.id});
    };
  });
}
const ring = (pct, size, stroke, color, inner) => { const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * Math.min(100, pct) / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>${inner || ""}</svg>`; };
const FLAME = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--flame)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>`;
function renderHud(){
  const g = PROG, el = $("#hud");
  if (!g || g.none){ el.classList.add("hide"); return; }
  const pct = Math.round(100 * (g.xp - g.level_xp) / Math.max(1, g.next_xp - g.level_xp));
  el.innerHTML = `<span class="streak ${g.streak ? "" : "cold"}" title="Streak: days in a row with a disc filed${g.streak && !g.streak_today ? ". File one today to keep it going" : ""}. Best: ${g.best_streak}">${FLAME}${g.streak ? `${g.streak} day${g.streak === 1 ? "" : "s"}` : "0 days"}</span>
    <button class="lvl" id="lvlbtn" title="Your shelf, rank and badges"><span class="n">${g.level}</span><span class="t"><div><b>${esc(g.rank)}</b><span style="color:var(--muted)">${g.xp.toLocaleString()} / ${g.next_xp.toLocaleString()} XP</span></div><div class="bar xp"><i style="width:${pct}%"></i></div></span></button>`;
  el.classList.remove("hide");
  $("#lvlbtn").onclick = () => showTab("library");
}
// Fetch progress; when it moved on, say so (level up, new badges).
async function loadProgress(announce){
  let g;
  try { g = await api("/api/progress"); } catch(e){ return; }
  const old = PROG;
  PROG = g;
  renderHud();
  if (!announce || !old || old.none || g.none) return;
  if (g.level > old.level) chime("level");
  else if (g.badges.some(b => b.earned && !old.badges.find(o => o.id === b.id && o.earned))) chime("badge");
  if (g.level > old.level) toast(`Level ${g.level}!`, g.rank !== old.rank ? `You're a ${g.rank} now.` : `${(g.next_xp - g.xp).toLocaleString()} XP to the next level.`);
  const had = new Set(old.badges.filter(b => b.earned).map(b => b.id));
  g.badges.filter(b => b.earned && !had.has(b.id)).forEach(b => toast(`Badge: ${b.name}`, b.how, "var(--ok)"));
  g.goals.forEach((x, k) => { if (x.done && !old.goals[k].done) toast("Daily goal done", `${x.label}: +${x.bonus} XP`, "var(--accent)"); });
  if (TAB === "library") renderShelf();
}
function confChip(p){
  const w = liveWarnings(p).length;
  if (p.auto && !p.auto.blocked.length) return `<span class="chip good">Sure match</span>`;
  return w ? `<span class="chip warnc">${w} thing${w === 1 ? "" : "s"} to check</span>` : `<span class="chip">Check the names</span>`;
}
function epRange(p){
  const e = p.items.filter(it => it.role === "episode" && it.action === "move" && it.season).flatMap(it => it.episodes || [it.episode]).filter(Boolean).sort((a,b) => a-b);
  return e.length ? `Season ${p.season} · episode${e.length > 1 ? `s ${e[0]} to ${e[e.length-1]}` : ` ${e[0]}`}` : p.season ? `Season ${p.season}` : "";
}

const KIND = {"Featurettes":"Featurette","Behind the Scenes":"Behind the scenes","Deleted Scenes":"Deleted scene","Interviews":"Interview","Scenes":"Scene","Shorts":"Short","Trailers":"Trailer","Other":"Other"};
const SUFFIX = {"Behind the Scenes":"behindthescenes","Deleted Scenes":"deleted","Featurettes":"featurette","Interviews":"interview","Scenes":"scene","Shorts":"short","Trailers":"trailer","Other":"other"};
// a plan's folder in the library, or a full path for Movies/TV folders kept somewhere else
const inLib = rel => /^([A-Za-z]:|[\\/]{2})/.test(rel || "") ? [rel] : [LIB, rel];
function destOf(p, it){
  // TV extras can belong to the whole show, a season (default) or one episode (Plex's TV extras guide)
  const cat = it.category || "Other";
  const folder = SERVER === "kodi" ? "Extras" : cat;   // Kodi keeps all extras in one Extras folder
  if (it.role === "extra" && p.kind === "tv" && it.attach === "show") return [...inLib(p.library_dir), folder].join("\\") + "\\" + safe(it.name) + ".mkv";
  if (it.role === "extra" && p.kind === "tv" && it.attach === "episode" && SERVER !== "kodi"){
    if (!it.attach_to) return "pick the episode it belongs to";
    const same = p.items.filter(o => o.role === "extra" && o.action === "move" && o.attach === "episode" && o.attach_to === it.attach_to && (o.category || "Other") === cat);
    const k = same.findIndex(o => o === it || o.source === it.source);
    return inLib(it.dest_dir).join("\\") + "\\" + safe(`${it.attach_to}-${SUFFIX[cat] || "other"}${same.length > 1 ? k + 1 : ""}`) + ".mkv";
  }
  const parts = inLib(it.dest_dir);

// The "Type" menu: what each ripped title is. Extras pick their Plex category here too.
function typeValue(it){

  return it.role;   // main, edition, play_all
}
function typeOptions(p, it){

    + `<optgroup label="Extra">` + CATS.map(c => `<option value="x:${c}" ${("x:"+c)===cur?"selected":""}>${c}</option>`).join("") + `</optgroup>`;

const pad = n => String(n).padStart(2,"0");
const mmss = s => { s = +s||0; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}h${pad(m)}m` : `${m}m${pad(x)}s`; };

const filesOf = it => it.action !== "move" ? 0 : (it.needs_split && it.split ? it.split.starts.length - (it.split.skip||[]).length : 1);

function setType(p, it, v){
  const prefix = safe(p.title + (p.year ? ` (${p.year})` : ""));
  const tag = idTag(p.tmdb_id);

let polling = null;

async function load(keepEdits){
  const j = await api("/api/discs");
  LIB = j.library; LIB_RIPPED = j.ripped; SERVER = j.server || "plex"; SERVER_NAME = j.server_name || "Plex"; EXTRAS_SUFFIX = !!j.extras_suffix;
  $("#sub").textContent = `${j.discs.length} disc${j.discs.length === 1 ? "" : "s"} waiting` + (j.tmdb ? "" : " · no TMDB key"); $("#sub").title = `Library: ${LIB}`;
  if (keepEdits){ // only refresh job status, keep unsaved edits
    // Redraw just the cards whose filing status changed, so typing or a dropdown open on
    // another card isn't interrupted while a disc is filing.
    const byFolder = Object.fromEntries(j.discs.map(d => [d.folder, d]));
    discs.forEach((d, i) => {
      const job = byFolder[d.folder] ? byFolder[d.folder].job : ((j.jobs||{})[d.folder] || {state:"done", current:"Filed"});
      if (JSON.stringify(job || null) === JSON.stringify(d.job || null)) return;
      if (job && job.state === "done" && job.current !== "Discarded" && !(d.job && d.job.state === "done")) d._justFiled = true;
      d.job = job; redraw(i);
    });
    return;
  }
  discs = j.discs;
  render();
}

const gb = b => (b/1e9).toFixed(1) + " GB";
const eta = s => s == null ? "" : s >= 3600 ? `${Math.floor(s/3600)}h ${pad(Math.floor(s%3600/60))}m left` : `${Math.max(1, Math.round(s/60))} min left`;
const progText = a => a ? `${gb(a.done)} of ${gb(a.total)} · title ${Math.min(a.titles_done, a.titles)} of ${a.titles}` +
  (a.mb_s ? ` · ${a.mb_s} MB/s` : "") + (a.eta_s != null ? ` · ${eta(a.eta_s)}` : "") : "";
const pctOf = d => d.progress ? Math.max(d.progress.pct, d.ripping ? d.pct||0 : 0) : d.pct||0;
const stateText = d => {
  if (!d.loaded) return "Empty";
  if (d.filing) return d.filing.state === "running" ? `Filing into ${SERVER_NAME} ${d.filing.pct}%` + (d.filing.current ? ` · ${d.filing.current}` : "")
    : "Filing was cut off · it picks up again by itself" + (d.filing.current ? ` (${d.filing.current})` : "");
  if (d.filed) return `Filed into ${SERVER_NAME} · on your shelf`;
  if (d.ripping && d.state === "scanning") return "Reading the disc…" + (d.phase ? ` (MakeMKV: ${d.phase})` : "");
  // before saving, each MakeMKV run opens and analyses the disc again: say so instead of a stuck percentage
  if (d.ripping && d.phase) return `Ripping ${pctOf(d)}% · MakeMKV is reading the disc first: ${d.phase}` + (d.progress ? ` · ${gb(d.progress.done)} of ${gb(d.progress.total)} saved` : "");
  if (d.ripping) return `Ripping ${pctOf(d)}%` + (d.progress ? ` · ${progText(d.progress)}` : d.message ? ` · ${d.message}` : "");
  if (d.elsewhere) return d.progress ? `Ripping ${d.progress.pct}% (in another window) · ${progText(d.progress)}` : "Being ripped by another window";
  if (d.state === "done" && d.rip_label === d.label) return "Done · " + (d.message||"");
  if (["check","error","cancelled"].includes(d.state) && d.rip_label === d.label) return (d.state === "cancelled" ? "Cancelled" : "Problem: ") + (d.state === "cancelled" ? "" : d.message||"");
  if (d.state === "in_plex" && d.rip_label === d.label) return d.message;
  if (d.state === "low_space" && d.rip_label === d.label) return d.message;
  if (d.already) return "Ripped · waiting for review (ejects once you file it)";
  return "Waiting to rip";
};

function wireWizard(el){

    if (Object.keys(values).length) try { fetch("/api/settings", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({values}), keepalive:true}); } catch(e){}
  };
  el.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => go(+b.dataset.goto));
  el.querySelectorAll("[data-tile]").forEach(b => b.onclick = async () => {
    await save({[b.dataset.tile]: JSON.parse(b.dataset.v)}, true);

let SETS = null, SETGROUP = "library", SHOWADV = false;
const statusOf = n => (SETS.setup || []).find(x => x.name === n) || {};
const SET_STATUS = {output_root:"Rip folder", plex_library_root:"Media library folder", makemkvcon_path:"MakeMKV", mkvtoolnix_dir:"MKVToolNix", tmdb_api_key:"TMDB key", cyanrip_path:"cyanrip (music CDs)"};
function setField(row, meta){
  const [key, label, help, o = {}] = meta, v = row.value, id = "s_" + key;
  const st = SET_STATUS[key] ? statusOf(SET_STATUS[key]) : null;
  const flag = st && st.name ? `<span class="chip ${st.ok ? "good" : st.required ? "warnc" : ""}">${st.ok ? "✓ found" : st.required ? "needed" : "not found"}</span>` : "";
  const link = o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.linkText || "More")}</a>` : "";
  const helpHtml = (help || link || (st && !st.ok && st.detail) || (st && st.warn)) ? `<div class="help">${esc(help)}${help && link ? " " : ""}${link}${st && !st.ok && st.detail && row.kind !== "secret" ? `<div class="${st.required ? "err" : ""}">${esc(st.detail)}${st.link && !o.link ? ` · <a href="${esc(st.link)}" target="_blank" rel="noopener">Download</a>` : ""}</div>` : ""}${st && st.ok && st.warn ? `<div class="warnline">⚠ ${esc(st.warn)}</div>` : ""}</div>` : "";
  if (row.kind === "bool") return `<div class="srow sw"><div class="lbl"><label for="${id}">${esc(label)}</label>${helpHtml}</div>
      <label class="switch bare"><input type="checkbox" id="${id}" data-k="${key}" ${v ? "checked" : ""}><span class="tog"></span><span class="sr">${esc(label)}</span></label><span class="saved" data-saved="${key}"></span></div>`;
  let ctl;
  if (row.kind === "secret") ctl = v
    ? `<span class="chip good">✓ saved</span><button data-change="${key}">Change</button><input type="password" id="${id}" data-k="${key}" class="hide" autocomplete="off" placeholder="paste the new one">`
    : `<input type="password" id="${id}" data-k="${key}" autocomplete="off" placeholder="paste it here">`;
  else if (row.kind === "select") ctl = `<select id="${id}" data-k="${key}">${(row.choices||[]).map(c => `<option value="${esc(c.value)}" ${c.value === v ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select>`;
  else ctl = `<input id="${id}" data-k="${key}" type="${row.kind === "number" ? "number" : "text"}" ${row.kind === "number" ? 'min="0"' : ""} value="${esc(v)}" ${row.placeholder ? `placeholder="${esc(row.placeholder)}"` : o.pick ? `placeholder="Click to choose a ${o.pick === "file" ? "file" : "folder"}"` : ""} class="${o.unit || o.short ? "short" : ""}" ${key.endsWith("_root") || key.endsWith("_dir") || key.endsWith("_folder") || key.endsWith("_path") ? 'spellcheck="false"' : ""}>`
    + (o.unit ? `<span class="unit">${esc(o.unit)}</span>` : "")
    + (o.pick ? `<button data-pick="${key}" data-kind="${o.pick}" ${o.under ? `data-under="${o.under}"` : ""}>Browse…</button>` : "");
  return `<div class="srow"><div class="lbl"><label for="${id}">${esc(label)}</label> ${flag}${helpHtml}</div><div class="ctl">${ctl}<span class="saved" data-saved="${key}"></span></div></div>`;
}
function renderSettings(){
  const el = $("#settingsTab"), j = SETS;
  const rows = Object.fromEntries(j.settings.map(r => [r.key, r]));
  const server = (rows.media_server || {}).value;
  const groups = SET_GROUPS.filter(g => !g.only || g.only === server);
  const known = new Set(SET_GROUPS.flatMap(g => g.items.map(i => i[0])));
  const extra = j.settings.filter(r => !known.has(r.key)).map(r => [r.key, r.label, ""]);
  if (extra.length) groups.push({id:"other", name:"Other", icon:"M4 12h16", intro:"", items:extra});
  if (!groups.some(g => g.id === SETGROUP)) SETGROUP = groups[0].id;
  const need = (j.setup||[]).filter(x => x.required && !x.ok);
  const g = groups.find(x => x.id === SETGROUP);
  const items = g.items.filter(m => rows[m[0]]);
  const basic = items.filter(m => !(m[3] || {}).adv), adv = items.filter(m => (m[3] || {}).adv);
  const icon = d => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
  const groupNeeds = gg => gg.items.some(m => SET_STATUS[m[0]] && need.some(x => x.name === SET_STATUS[m[0]]));
  el.innerHTML = `
    ${need.length ? `<div class="warn" style="margin-bottom:16px"><b>Shelfrip needs ${need.length === 1 ? "one more thing" : need.length + " more things"} before it can rip:</b> ${need.map(x => esc(x.name)).join(", ")}.</div>` : ""}
    <div class="setwrap">
      <nav class="setnav" aria-label="Settings sections">${groups.map(x => `<button data-g="${x.id}" class="${x.id === SETGROUP ? "cur" : ""}" aria-current="${x.id === SETGROUP}">${icon(x.icon)}<span>${esc(x.name)}</span>${groupNeeds(x) ? `<i class="dot" title="Needs attention"></i>` : ""}</button>`).join("")}</nav>
      <section class="setbody">
        <h2>${esc(g.name)}</h2>${g.intro ? `<p class="intro">${esc(g.intro)}</p>` : ""}
        <div class="sgroup">${basic.map(m => setField(rows[m[0]], m)).join("")}</div>
        ${adv.length ? `<button class="advtoggle" id="advt" aria-expanded="${SHOWADV}">${SHOWADV ? "Hide" : "Show"} more options (${adv.length})</button>
          <div class="sgroup ${SHOWADV ? "" : "hide"}">${adv.map(m => setField(rows[m[0]], m)).join("")}</div>` : ""}
        ${g.id === "app" ? `<div class="srow"><div class="lbl"><label>Something not working?</label><div class="help">Makes a zip of Shelfrip's logs and settings, with your keys removed, to attach to a bug report.</div></div>
          <div class="ctl" id="probctl"><button id="probbtn">Make a problem report</button></div></div><div id="inbox"></div>` : ""}
        <p class="foot2">Saved as you go, in ${esc(j.path)}. Keys are never shown again once saved.<br>
          Shelfrip ${esc((j.version||{}).current || "")} is free.${DONATE ? ` If it saves you time, you can <a href="${esc(DONATE)}" target="_blank" rel="noopener">support its development</a>.` : ""} This product uses the TMDB API but is not endorsed or certified by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
          Ripping is done by MakeMKV, which you install and license yourself.</p>
      </section>
    </div>`;
  el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { SETGROUP = b.dataset.g; renderSettings(); });
  if ($("#advt", el)) $("#advt", el).onclick = () => { SHOWADV = !SHOWADV; renderSettings(); };
  el.querySelectorAll("[data-change]").forEach(b => b.onclick = () => { const i = $("#s_" + b.dataset.change, el); i.classList.remove("hide"); i.focus(); b.remove(); });
  el.querySelectorAll("[data-k]").forEach(i => i.onchange = () => saveOne(i));
  if ($("#inbox", el)) loadInbox($("#inbox", el));
  if ($("#probbtn", el)) $("#probbtn", el).onclick = async () => {
    $("#probbtn", el).disabled = true;
    const r = await api("/api/problem", {});
    $("#probctl", el).innerHTML = r.error ? `<span class="err">${esc(r.error)}</span>`
      : `<span style="display:grid;gap:4px"><span>Saved: <b style="word-break:break-all">${esc(r.path)}</b></span>
         <a href="${esc(r.issues)}" target="_blank" rel="noopener">Open a bug report on GitHub and attach it</a></span>`;
  };
  el.querySelectorAll("[data-pick]").forEach(b => {  // clicking an empty folder/file box opens the picker too
    const i = $("#s_" + b.dataset.pick, el);
    if (i){ i.classList.add("pickme"); i.addEventListener("click", () => { if (!i.value.trim() && !i.dataset.asked){ i.dataset.asked = 1; b.click(); } }); }
  });
  el.querySelectorAll("[data-pick]").forEach(b => b.onclick = async () => {
    const i = $("#s_" + b.dataset.pick, el);
    b.disabled = true;
    try {
      // a folder inside another one (Movies inside the media library): start the picker there
      const base = b.dataset.under ? ((SETS.settings.find(r => r.key === b.dataset.under) || {}).value || "") : "";
      const full = /^([A-Za-z]:|[\\/]{2})/.test(i.value);  // a folder kept outside the library
      const start = base && !full ? (i.value ? base.replace(/[\\/]+$/, "") + "\\" + i.value : base) : i.value;
      const r = await api("/api/pick", {kind: b.dataset.kind, start, title: i.closest(".srow").querySelector("label").textContent});
      if (r.available === false) { i.focus(); toast("Type the path", r.error || "There's no folder picker on this computer."); }
      else if (r.path) { i.value = r.path; await saveOne(i); }
    } finally { b.disabled = false; }
  });
}
async function saveOne(i){
  const k = i.dataset.k, mark = $(`[data-saved="${k}"]`);
  let v = i.type === "checkbox" ? i.checked : i.value.trim();
  if (i.type === "password" && !v) return;
  if (i.type === "number" && (v === "" || isNaN(+v) || +v < 0)){  // not a number: put the saved value back
    const row = SETS.settings.find(r => r.key === k); i.value = row ? row.value : ""; return;
  }
  try {
    const r = await api("/api/settings", {values: {[k]: v}});
    SETS = r;
    if (i.type === "password" || k === "media_server" || SET_STATUS[k]) renderSettings();
    const m2 = $(`[data-saved="${k}"]`);
    if (m2){ m2.textContent = "✓ Saved"; m2.className = "saved on"; setTimeout(() => m2 && (m2.className = "saved"), 1800); }
    if (k === "movies_folder" || k === "tv_folder" || k === "music_library_root" || k === "plex_library_root") renderSettings();  // shows the folder as saved, and what empty finds
    if (["output_root","plex_library_root","media_server","format_folders","movies_folder","tv_folder"].includes(k)) load(false);
    if (k === "job_total_discs") loadProgress(false);
    if (k === "sounds"){ SOUND = v; if (v) chime("file"); }
    if (k === "share_discs") SHARING = v;
  } catch(e){ if (mark){ mark.textContent = e.message; mark.className = "saved on err"; } }
}
async function loadSettings(){
  const el = $("#settingsTab");
  const j = await api("/api/settings");
  SETS = j;
  if (j.first_run){  // first start: just the essentials, one step at a time
    if (!WZRESUMED){ WZRESUMED = true; WZSTEP = Math.min(+j.setup_step || 0, WZ_STEPS.length - 1); }  // pick up where you left off
    el.innerHTML = wizard();
    wireWizard(el);
    return;
  }
  renderSettings();
}
(async () => {
  try { await api("/api/drives"); APP = true; } catch(e){ APP = false; }
  if (!APP) return;
  $("#tabs").classList.add("on"); $("#quit").classList.remove("hide");

  let t = "drives"; try { t = localStorage.getItem("tab") || "drives"; } catch(e){}

  try { const v = await api("/api/version"); if (v.latest) showUpdate(v);
        if (/^https:\/\//.test(v.donate || "")){ $("#donate").href = v.donate; $("#donate").classList.remove("hide"); DONATE = v.donate; } } catch(e){}
  try { const s = await api("/api/settings"); SOUND = ((s.settings||[]).find(x => x.key === "sounds") || {value:true}).value !== false; SHARING = ((s.settings||[]).find(x => x.key === "share_discs") || {value:true}).value !== false; if (s.first_run || (s.setup||[]).some(x => !x.ok && x.required)) t = "settings"; } catch(e){}

  };
})();

// Feedback inbox: only on the copy that deployed the disc database (it has server/.secrets.json)
let INBOXALL = false;
async function loadInbox(el){
  let j; try { j = await api(`/api/inbox${INBOXALL ? "?all=1" : ""}`); } catch(e){ return; }
  if (!j.admin) return;
  const when = t => new Date(t * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  const KIND = {idea:"Idea", problem:"Problem", other:"Other"};
  const fb = (j.feedback || []).map(f => `<div class="ti" style="display:grid;gap:3px${f.done ? ";opacity:.55" : ""}">
      <div class="row" style="gap:8px;align-items:baseline"><span class="chip">${esc(KIND[f.kind] || f.kind)}</span><b>${esc(f.title || "(no title)")}</b>
        <span style="flex:1"></span><small style="color:var(--muted)">${esc(when(f.created))}</small>
        <button data-done="${f.id}" data-v="${f.done ? 0 : 1}">${f.done ? "Not done" : "Done"}</button></div>
      ${f.body ? `<div style="white-space:pre-wrap;font-size:13px">${esc(f.body)}</div>` : ""}
      <small style="color:var(--muted)">${[f.contact ? `Reply to ${esc(f.contact)}` : "", f.app_version ? `Shelfrip ${esc(f.app_version)}` : "", esc(f.os || "")].filter(Boolean).join(" · ")}</small></div>`).join("");
  const rp = (j.reports || []).map(r => `<div class="ti" style="font-size:13px">
      <b>${esc(r.title || `tmdb-${r.tmdb_id}`)}${r.season != null ? ` season ${r.season}` : ""}</b> reported wrong ${r.n > 1 ? `${r.n} times` : "once"}${r.disc_label ? ` (disc ${esc(r.disc_label)})` : ""}.
      ${r.better && r.better.title ? `Filed instead as ${esc(r.better.title)}${r.better.year ? ` (${esc(r.better.year)})` : ""}${r.better.season != null ? ` season ${r.better.season}` : ""}.` : ""}
      <span style="color:var(--muted)">Now answering: ${r.answer ? (r.answer.disputed ? "nothing (disputed)" : esc(r.answer.title) + (r.answer.confirmed ? ", confirmed" : ", not confirmed")) : "nothing"}.</span></div>`).join("");
  el.innerHTML = `<div class="srow" style="display:block"><div class="lbl"><label>Feedback inbox</label>
      <div class="help">Only shown on this PC, because it's the one that runs the disc database.</div></div>
    ${j.error ? `<div class="err">${esc(j.error)}</div>` : `
    <div class="tidy" style="margin-top:8px">${fb || `<div style="color:var(--muted);font-size:13px">No ${INBOXALL ? "" : "new "}feedback.</div>`}</div>
    <button id="inball" style="margin-top:6px">${INBOXALL ? "Hide done" : "Show done too"}</button>
    <div class="lbl" style="margin-top:16px"><label>Wrong answers people reported</label>
      <div class="help">The disc database already counts these against the answer. Two installs agreeing on another answer replaces it.</div></div>
    <div class="tidy" style="margin-top:8px">${rp || `<div style="color:var(--muted);font-size:13px">None.</div>`}</div>`}</div>`;
  el.querySelectorAll("[data-done]").forEach(b => b.onclick = async () => { b.disabled = true; await api("/api/inbox", {id: +b.dataset.done, done: b.dataset.v === "1"}); loadInbox(el); });
  if ($("#inball", el)) $("#inball", el).onclick = () => { INBOXALL = !INBOXALL; loadInbox(el); };
}
// Feedback: sent to the Shelfrip disc database's server (no account needed), or posted on GitHub
const FB_KINDS = [["idea","Idea"],["problem","Something's wrong"],["other","Other"]];
let FBKIND = "idea";
function feedbackDialog(pre){
  pre = pre && pre.trouble ? pre : null;  // (a click event when opened from the Feedback button)
  let d = $("#fbdlg");
  if (!d){ d = document.createElement("dialog"); d.id = "fbdlg"; d.className = "disc"; document.body.appendChild(d);
    d.addEventListener("click", e => { if (e.target === d) d.close(); }); }
  const draw = () => {
    const keep = pre && !$("#fbt", d) ? {t: pre.t, m: pre.m, c: ""} : {t: $("#fbt", d)?.value || "", m: $("#fbm", d)?.value || "", c: $("#fbc", d)?.value || ""};
    d.innerHTML = `<div class="fb">
      <h2>Send feedback</h2>
      <span style="color:var(--muted);font-size:13px">Ideas, bugs, wrong names, anything. It goes straight to the people who make Shelfrip.</span>
      <div class="seg filt" role="group" aria-label="Kind" style="justify-self:start">${FB_KINDS.map(([k, n]) => `<button data-k="${k}" class="${k === FBKIND ? "on" : ""}" aria-pressed="${k === FBKIND}">${esc(n)}</button>`).join("")}</div>
      <label>In a few words<input type="text" id="fbt" maxlength="200" value="${esc(keep.t)}" placeholder="${FBKIND === "problem" ? "e.g. Filing stops at 50% on TV discs" : "e.g. Show the runtime on each title"}"></label>
      <label>Details<textarea id="fbm" maxlength="5000" placeholder="${FBKIND === "problem" ? "What did you do, what happened, and what did you expect?" : "Tell us more"}">${esc(keep.m)}</textarea></label>
      <label>Your email, if you'd like a reply (optional)<input type="text" id="fbc" maxlength="200" value="${esc(keep.c)}" autocomplete="email"></label>
      <label class="chk"><input type="checkbox" id="fbv" checked> Add my Shelfrip and Windows versions</label>
      ${FBKIND === "problem" ? `<div id="fbprob" style="font-size:13px;color:var(--muted)">Need to send logs? <button id="fbrep">Make a problem report</button> and attach it to a <a href="#" id="fbgh2">GitHub issue</a>.</div>` : ""}
      <div id="fbmsg" style="font-size:13px"></div>
      <div class="row" style="align-items:center"><button class="primary" id="fbgo">Send</button><button id="fbx">Cancel</button>
        <span style="flex:1"></span><a href="#" id="fbgh" style="font-size:13px">Post on GitHub instead</a></div></div>`;
    d.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { FBKIND = b.dataset.k; draw(); });
    $("#fbx", d).onclick = () => d.close();
    const rep = $("#fbrep", d);
    if (rep) rep.onclick = async () => {
      rep.disabled = true; rep.textContent = "Making the report…";
      const r = await api("/api/problem", {});
      $("#fbprob", d).innerHTML = r.error ? `<span class="err">${esc(r.error)}</span>`
        : `Saved <b style="word-break:break-all">${esc(r.path)}</b>. Drag it into a <a href="#" id="fbgh2">GitHub issue</a> to attach it.`;
      wireGh();
    };
    const read = () => ({t: $("#fbt", d).value.trim(), m: $("#fbm", d).value.trim(), c: $("#fbc", d).value.trim(), v: $("#fbv", d).checked});
    const github = async e => {
      e.preventDefault();
      const f = read();
      let body = f.m || f.t || "";
      if (f.v){ try { const v = await api("/api/version"); body += `\n\n---\nShelfrip ${v.current || "?"}${v.os ? ` on ${v.os}` : ""}`; } catch(e){} }
      const name = FB_KINDS.find(x => x[0] === FBKIND)[1];
      const title = f.t || f.m ? `${FBKIND === "problem" ? "Bug" : name}: ${f.t || f.m.split("\n")[0].slice(0, 80)}` : "";
      window.open(`https://github.com/Shelfrip/ShelfRip/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, "_blank", "noopener");
    };
    const wireGh = () => d.querySelectorAll("#fbgh, #fbgh2").forEach(a => a.onclick = github);
    wireGh();
    $("#fbgo", d).onclick = async () => {
      const f = read();
      if (!f.t && !f.m){ $("#fbt", d).focus(); return; }
      if (f.c && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.c)){ $("#fbmsg", d).innerHTML = `<span class="err">That email doesn't look right.</span>`; $("#fbc", d).focus(); return; }
      $("#fbgo", d).disabled = true; $("#fbmsg", d).textContent = "Sending…";
      const r = await api("/api/feedback", {kind: FBKIND, title: f.t, body: f.m, contact: f.c, versions: f.v});
      if (r.error){ $("#fbgo", d).disabled = false; $("#fbmsg", d).innerHTML = `<span class="err">${esc(r.error)}</span>`; return; }
      if (pre) api("/api/trouble", {id: pre.trouble, action: "dismiss"});  // sent: don't offer it again
      d.close(); $("#fbt", d).value = ""; $("#fbm", d).value = "";
      d.innerHTML = "";
      toast("Thanks for the feedback!", f.c ? "We'll reply by email if we have questions." : "");
    };
  };
  if (pre) d.innerHTML = "";  // start from the report, not a half-written message
  draw();
  d.showModal();
  if (pre){ const m = $("#fbm", d); m.focus(); m.setSelectionRange(18, 18); } else $("#fbt", d).focus();
}
$("#fbbtn").onclick = feedbackDialog;
$("#scan").onclick = async () => { $("#scan").disabled = true; const j = await api("/api/scan", {}); $("#scan").disabled = false; await load(false); $("#sub").textContent += ` · ${j.planned} new`; };
load(false).catch(e => $("#list").innerHTML = `<p class="empty err">${esc(e.message)}</p>`);
</script>
