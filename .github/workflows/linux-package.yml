name: Linux package
on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_linux.py installer
      - run: python tests/test_linux_install.py
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python -c 'import os,pathlib; assert pathlib.Path("installer/Shelfrip-" + os.environ["RELEASE_TAG"].removeprefix("v") + "-linux.tar.gz").is_file(), "Release tag must match APP_VERSION"'
      - uses: actions/upload-artifact@v4
        with:
          name: shelfrip-linux
          path: installer/Shelfrip-*-linux.tar.gz*
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shelfrip-linux
          path: installer
      - name: Attach the Linux package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" installer/Shelfrip-*-linux.tar.gz*
